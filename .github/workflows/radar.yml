name: Радар вакансий

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Искать вакансии и слать в бот
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
        run: python main.py

      - name: Запомнить отправленное
        run: |
          if [[ -z "$(git status --porcelain seen.json)" ]]; then
            echo "Новых вакансий не было — сохранять нечего."
            exit 0
          fi
          git config user.name "job-radar"
          git config user.email "actions@github.com"
          git add seen.json
          git commit -m "память радара: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
