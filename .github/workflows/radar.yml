name: Радар вакансий

on:
  # Каждые 30 минут. GitHub иногда запускает с задержкой в пик нагрузки —
  # это нормально, вакансии всё равно приходят несколько раз в час.
  schedule:
    - cron: "*/30 * * * *"
  # Кнопка ручного запуска на вкладке Actions
  workflow_dispatch:

# Нужно, чтобы workflow мог сохранять seen.json обратно в репозиторий
permissions:
  contents: write

# Если предыдущий запуск ещё идёт — не запускать второй параллельно,
# иначе два процесса пришлют одни и те же вакансии дважды
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Искать вакансии и слать в бот
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
        run: python main.py

      - name: Запомнить отправленное
        run: |
          if [[ -z "$(git status --porcelain seen.json leads_offset.txt)" ]]; then
            echo "Новых вакансий не было — сохранять нечего."
            exit 0
          fi
          git config user.name "job-radar"
          git config user.email "actions@github.com"
          git add seen.json
          [ -f leads_offset.txt ] && git add leads_offset.txt
          git commit -m "память радара: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Пока мы работали, расписание могло запустить соседний прогон —
          # подтягиваем его изменения, чтобы push не отвалился
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
